# Pemeriksaan wajib: dijalankan setiap push dan setiap pull request.
#
# Ada tiga job:
#
# 1. `backend`  pemeriksaan statis dan test Python, tanpa server dan tanpa
#               jaringan. Semua dependensi berat ditiadakan dengan sengaja
#               supaya hasilnya cepat dan tidak bergantung pada layanan luar:
#               embedding memakai stub hashing (USE_LOCAL_EMBEDDING=0) sehingga
#               torch dan model 470 MB tidak diunduh, LLM memakai provider
#               mock sehingga tidak ada panggilan ke Groq, dan test provider
#               memakai httpx.MockTransport sehingga tidak ada koneksi keluar.
# 2. `frontend` typegen, tsc, eslint, dan build produksi.
# 3. `e2e`      backend dan frontend sungguhan plus browser. Lihat komentar di
#               job itu untuk alasan kenapa pemeriksaan ini perlu walaupun dua
#               job sebelumnya sudah hijau.
#
# Kalau salah satu pemeriksaan ini gagal, jangan merge. Itu artinya ada yang
# rusak, dan lebih murah diperbaiki di sini daripada di server.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Bisa dijalankan manual dari tab Actions kalau perlu memeriksa ulang
  # tanpa mengubah kode.
  workflow_dispatch:

# Batalkan pemeriksaan lama kalau ada push baru ke branch yang sama.
# Tanpa ini, push beruntun menumpuk dan menghabiskan waktu menunggu
# hasil yang sudah tidak relevan.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff dan pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Pasang dependency
        # torch sengaja tidak dipasang. Test memakai stub embedding, dan
        # paket itu sendiri 200 MB lebih. Kalau nanti ada test yang benar
        # benar membutuhkannya, pasang di sini dengan index CPU.
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pydantic pydantic-settings \
            python-multipart httpx numpy chromadb pypdf redis \
            pytest pytest-asyncio pytest-cov ruff "reportlab>=4.0"

      - name: Lint (ruff)
        run: python -m ruff check app tests scripts

      - name: Test (pytest)
        # Environment sengaja tidak diisi dari .env. conftest.py menyiapkan
        # semua variabel yang dibutuhkan, termasuk passcode uji, provider
        # mock, dan stub embedding.
        run: python -m pytest

  frontend:
    name: Frontend (typegen, tsc, eslint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pasang dependency
        # `--legacy-peer-deps` wajib, sama seperti di Dockerfile. Tanpa flag
        # ini npm 10 menolak pohon dependensi yang sebenarnya valid, dan
        # langkah ini gagal sebelum sempat memeriksa apa pun.
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Generate tipe route Next.js
        # WAJIB sebelum tsc. Next.js 16 menghasilkan tipe `PageProps` dan
        # `LayoutProps` yang dipakai halaman, dan tipe itu belum ada di
        # checkout bersih. Tanpa langkah ini, tsc gagal dengan
        # "Cannot find name 'PageProps'".
        run: npx next typegen

      - name: Periksa tipe (tsc)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npx eslint .

      - name: Build
        # Variabel di bawah adalah build-argumen yang sama dengan yang
        # dipakai docker-compose.yml. `NEXT_PUBLIC_*` di-inline saat build,
        # jadi nilainya harus ada di sini, bukan saat runtime.
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          BACKEND_ORIGIN: http://api:8000
          NEXT_PUBLIC_USE_BACKEND: "1"
          NEXT_PUBLIC_API_BASE_URL: ""
        run: npx next build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # 60 menit, bukan 25. Run pertama terpotong di batas 25 menit setelah 24
    # menit terpakai dan belum selesai, jadi 40 menit pun masih tipis. Kalau
    # nanti masih terpotong, yang perlu diperiksa bukan angka ini melainkan
    # test mana yang menghabiskan waktu, dan itu terlihat dari laporan per
    # test. Menaikkan angka tanpa mengukur hanya memindahkan masalah.
    #
    # Test sengaja TIDAK dijalankan paralel. Banyak test mengunggah berkas
    # yang sama, dan `waitForDocumentReady` mencocokkan baris tabel lewat nama
    # berkas; dengan dua test berjalan bersamaan, nama itu muncul di dua baris
    # dan test gagal secara acak. Test yang gagal acak lebih buruk daripada
    # test yang lambat.
    timeout-minutes: 60
    needs: [backend]

    # Test ini menyalakan backend dan frontend sungguhan, lalu menggerakkan
    # browser. Itu memang lebih mahal daripada dua job di atas, jadi alasannya
    # perlu ditulis: dua job lain memeriksa bagian secara terpisah, dan
    # keduanya bisa hijau sementara sambungannya putus. Yang pernah terjadi
    # dan hanya tertangkap di sini adalah halaman yang terbuka karena ada
    # penanda cookie, tapi setiap panggilan API kena 401 sehingga pengguna
    # melihat "sesi berakhir" di mana-mana, dan proxy `/api/v1/*` yang jatuh ke
    # halaman HTML Next.js alih-alih ke FastAPI.
    #
    # Tidak ada layanan eksternal yang dipanggil. LLM memakai provider mock
    # dan embedding memakai stub hashing, jadi tidak ada API key, tidak ada
    # biaya, dan tidak ada model 470 MB yang diunduh. Yang diuji tetap
    # pipeline utuh dari unggah berkas sampai streaming jawaban.

    env:
      # Passcode uji. Hash dihitung dari nilai ini, bukan ditulis terpisah,
      # supaya tidak ada dua sumber kebenaran yang bisa berbeda.
      E2E_PASSCODE: "uji-e2e-playwright-ci"
      LLM_PROVIDER: mock
      LLM_FALLBACK_CHAIN: ""
      USE_LOCAL_EMBEDDING: "0"
      REDIS_URL: ""
      SUPABASE_URL: ""
      SUPABASE_SERVICE_KEY: ""
      GROQ_API_KEY: ""
      DEBUG: "true"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      CHROMA_PERSIST_DIR: ${{ github.workspace }}/e2e-data/chroma
      SQLITE_FALLBACK_PATH: ${{ github.workspace }}/e2e-data/metadata.db
      BACKEND_ORIGIN: http://127.0.0.1:8000
      NEXT_PUBLIC_USE_BACKEND: "1"
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Dependency backend sengaja sama dengan job `backend`. Kalau daftar ini
      # berbeda, E2E bisa gagal karena paket yang tidak terpasang, bukan karena
      # ada yang rusak di aplikasi.
      - name: Pasang dependency backend
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pydantic pydantic-settings \
            python-multipart httpx numpy chromadb pypdf redis \
            pytest pytest-asyncio pytest-cov ruff "reportlab>=4.0"

      - name: Siapkan konfigurasi E2E
        working-directory: backend
        # Hash dibuat dari `E2E_PASSCODE` oleh fungsi yang sama dengan yang
        # dipakai aplikasi dan skrip `make_passcode`, jadi tidak mungkin
        # berbeda dari yang diverifikasi saat login.
        run: |
          mkdir -p "$CHROMA_PERSIST_DIR" "$(dirname "$SQLITE_FALLBACK_PATH")"
          HASH=$(python -c "from app.core.security import hash_passcode; import os; print(hash_passcode(os.environ['E2E_PASSCODE']))")
          {
            echo "ACCESS_PASSCODE_SHA256=$HASH"
            echo "DEBUG=$DEBUG"
            echo "CORS_ORIGINS=$CORS_ORIGINS"
            echo "LLM_PROVIDER=$LLM_PROVIDER"
            echo "USE_LOCAL_EMBEDDING=$USE_LOCAL_EMBEDDING"
            echo "CHROMA_PERSIST_DIR=$CHROMA_PERSIST_DIR"
            echo "SQLITE_FALLBACK_PATH=$SQLITE_FALLBACK_PATH"
          } > .env
          echo "Konfigurasi E2E ditulis ke backend/.env"

      - name: Nyalakan backend
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/api.log" 2>&1 &
          # Tunggu sampai benar-benar siap, bukan sekadar `sleep` dengan angka
          # yang ditebak. Kalau 60 detik habis, log ikut dicetak supaya
          # penyebabnya terlihat tanpa perlu membuka artefak.
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health > /dev/null 2>&1; then
              echo "Backend siap setelah ${i} detik"
              exit 0
            fi
            sleep 1
          done
          echo "Backend tidak siap dalam 60 detik. Log terakhir:" >&2
          tail -n 40 "$RUNNER_TEMP/api.log" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pasang dependency frontend
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Pasang browser Playwright
        working-directory: frontend
        # Hanya chromium: spec memakai project chromium saja, dan mengunduh
        # firefox serta webkit berarti ratusan MB untuk browser yang tidak
        # pernah dipakai.
        run: npx playwright install --with-deps chromium

      - name: Build frontend untuk E2E
        working-directory: frontend
        # Build produksi, bukan `next dev`. `next dev` mengompilasi halaman saat
        # pertama dibuka; di runner CI itu memakan lebih dari 15 detik, sehingga
        # test pertama sudah kehabisan waktu di langkah login sebelum halaman
        # sempat dirender. Build produksi tidak mengompilasi saat request, dan
        # yang diuji jadi bentuk yang benar-benar dikirim ke pengguna.
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          BACKEND_ORIGIN: http://127.0.0.1:8000
          NEXT_PUBLIC_USE_BACKEND: "1"
          NEXT_PUBLIC_API_BASE_URL: ""
        run: npx next build --webpack

      - name: Nyalakan frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          nohup npx next start --port 3000 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null 2>&1; then
              echo "Frontend siap setelah ${i} detik"
              exit 0
            fi
            sleep 1
          done
          echo "Frontend tidak siap dalam 90 detik. Log terakhir:" >&2
          tail -n 40 "$RUNNER_TEMP/web.log" >&2
          exit 1

      - name: Jalankan E2E
        working-directory: frontend
        # Retry 1 kali karena test ini menyentuh browser dan proses jaringan;
        # kegagalan yang tidak konsisten bukan bugs aplikasi. Kegagalan yang
        # konsisten tetap muncul sebagai merah.
        #
        # `line` dipakai, bukan `html`, karena laporan HTML butuh server untuk
        # dibuka. Kegagalan yang butuh konteks visual diambil dari artefak.
        run: npx playwright test --retries=1 --reporter=line

      - name: Unggah artefak kegagalan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore
