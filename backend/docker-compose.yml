# Deployment satu instance: backend FastAPI + Caddy sebagai reverse proxy.
#
# ## Kenapa tidak perlu database, Redis, atau object storage
#
# Ini satu instance dengan disk persisten, jadi:
#
# - **SQLite** untuk metadata. Persisten di volume yang sama, nol konfigurasi.
#   Supabase/Turso hanya relevan kalau nanti diskalakan ke banyak instance.
# - **Dict in-process** untuk memori sesi. Redis menyelesaikan masalah
#   "banyak instance berbagi state"; di sini tidak ada banyak instance.
# - **ChromaDB** untuk vektor, disimpan di volume yang sama seperti SQLite.
#
# Menambah layanan untuk kebutuhan yang belum ada berarti menambah failure
# mode, biaya operasional, dan tempat Things silently gagal. Itu ditunda
# sampai ada alasan, bukan ditunda karena tidak jadi.

name: ida

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ida-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override supaya path data selalu menunjuk ke volume, apa pun isi
      # .env. Kalau kedua nilai ini lupa diisi, container akan menulis ke
      # filesystem miliknya sendiri dan semua hilang saat di-restart.
      CHROMA_PERSIST_DIR: /data/chroma
      SQLITE_FALLBACK_PATH: /data/metadata.db
      # API hanya ada di network internal compose dan selalu didahului Caddy,
      # jadi `X-Forwarded-For` boleh dipercaya untuk key rate limit. Tanpa ini
      # semua klien terlihat sebagai IP Caddy dan 5 percobaan login gagal
      # mengunci semua pengguna.
      TRUST_PROXY_HEADERS: "1"
    volumes:
      # Volume bernama, bukan bind mount ke path host. Alasannya: saat image
      # ditulis ulang (deploy versi baru), bind mount bisa tertimpa kalau
      # path-nya berubah; volume punya identitas sendiri dan tidak ikut
      # terhapus saat `docker compose down`.
      - ida-data:/data
    expose:
      # Hanya jaringan internal Compose yang boleh menjangkau. Port tidak
      # dipetakan ke host karena lalu lintas lewat Caddy; memetakannya juga
      # akan membuka API tanpa TLS ke seluruh internet.
      - "8000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Lifespan mengunduh model embedding (~470 MB) sebelum server listen.
      # Jendela 90s sering tidak cukup di server 1 GB dengan disk lambat, dan
      # karena healthcheck tidak memicu restart, compose berhenti dengan
      # "dependency failed to start": frontend dan Caddy tidak pernah
      # dijalankan.
      start_period: 600s
    logging:
      driver: json-file
      options:
        # Log tak berbatas akan memakan disk sampai instans tidak bisa menulis
        # sama sekali. 10 MB x 3 file sudah cukup untuk diagnosa.
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      # Context di luar direktori compose. Compose mendukungnya, tapi path
      # relatif dihitung dari berkas compose, bukan dari shell -- jadi ditulis
      # eksplisit supaya jelas mana yang dipakai.
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # `NEXT_PUBLIC_*` di-*inline* ke bundle JavaScript saat `next build`.
        # Karena itu nilainya harus ada di sini sebagai build-argumen;
        # `environment:` di bawah hanya dibaca Next di server dan tidak akan
        # pernah sampai ke browser.
        #
        # `BACKEND_ORIGIN` juga build-time: rewrite di next.config.ts
        # dievaluasi saat build, bukan saat request. Nilai yang salah di sini
        # menghasilkan proxy yang menunjuk ke host yang tidak benar.
        BACKEND_ORIGIN: http://api:8000
        NEXT_PUBLIC_USE_BACKEND: "1"
        # Sengaja kosong: request ke `/api/v1/...` jadi path relatif yang
        # diteruskan rewrite Next.js. URL absolut hanya perlu kalau browser
        # benar-benar menembak backend langsung -- dan itu merusak cookie
        # sesi saat login (lihat README).
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_REPO_URL: "${NEXT_PUBLIC_REPO_URL:-}"
        NEXT_PUBLIC_API_DOCS_URL: "${NEXT_PUBLIC_API_DOCS_URL:-}"
        NEXT_PUBLIC_LANGFUSE_URL: "${NEXT_PUBLIC_LANGFUSE_URL:-}"
    image: ida-frontend:latest
    restart: unless-stopped
    environment:
      # Next.js standalone membaca PORT sendiri dari image; menyetelnya di sini
      # tidak dibutuhkan, tapi HOSTNAME tetap wajib agar server bind ke
      # 0.0.0.0 dan bisa dijangkau dari network compose.
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    # Versi di-pin, bukan `2-alpine` yang mengambang.
    #
    # Caddyfile di repo ini memakai direktif `request_body` (batas ukuran
    # body) yang baru ada sejak Caddy 2.10 dan masih ditandai experimental.
    # Dengan tag mengambang, `docker compose pull` bisa mengambil versi yang
    # mengubah atau menghapus perilakunya tanpa satu pun baris di repo ini
    # berubah, dan gejalanya baru muncul saat deploy.
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Sertifikat dan kunci Let's Encrypt. Volume wajib, bukan bind mount ke
      # path yang bisa terhapus: tanpa ini Caddy meminta sertifikat baru tiap
      # restart dan bisa kena rate limit Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ida-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
